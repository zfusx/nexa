# Rule orchestration config for template2x projects.
# Replace placeholders during initialization.
version: 3

project:
  name: "Nexa 主站"
  root: "/Users/fireparty/zfus/servers/nexa_mainsite"
  primary_language: "TypeScript"
  frameworks:
    - Astro
    - Tailwind CSS
    - React
  environments:
    - local
    - staging
    - production
  enabled_areas:
    api: false
    frontend: true
    backend: false
    database: false
    mobile: false
    deployment: true
    llm: true

documents:
  always:
    - AGENTS.md
    - AI_DIRECTIVES.md
    - PROJECT_CONTEXT.md
    - GOALS.md
    - CURRENT_TASKS.md
    - WORKLOG.md
    - DECISIONS.md
    - RESEARCH.md
    - HANDOFF.md
  conditional:
    api:
      - API_CONTRACT.md
    deployment:
      - DEPLOYMENT.md
    security:
      - SECRETS_POLICY.md
    tooling:
      - TOOLING_GUIDE.md

rules:
  cursor_rules_dir: .cursor/rules
  max_always_on_tokens: 2400
  max_rule_lines: 160
  require_frontmatter: true
  prefer_scoped_rules: true

selection:
  workflow:
    globs:
      - AGENTS.md
      - AI_DIRECTIVES.md
      - CURRENT_TASKS.md
      - GOALS.md
      - WORKLOG.md
      - HANDOFF.md
      - TOOLING_GUIDE.md
      - ".cursor/rules/**"
    load:
      - .cursor/rules/workflow.mdc
      - .cursor/rules/goals.mdc
      - .cursor/rules/testing.mdc
  research:
    globs:
      - RESEARCH.md
      - DECISIONS.md
      - PROJECT_CONTEXT.md
      - "docs/research/**"
      - "docs/adr/**"
    load:
      - .cursor/rules/research.mdc
  api:
    globs:
      - API_CONTRACT.md
      - "**/*api*"
      - "**/*route*"
      - "**/*handler*"
      - "**/*controller*"
      - "**/*schema*"
      - "**/*types*"
      - "**/*model*"
      - "**/*dto*"
    load:
      - .cursor/rules/api.mdc
  security:
    globs:
      - SECRETS_POLICY.md
      - DEPLOYMENT.md
      - ".github/workflows/**"
      - "**/.env*"
      - "**/*config*"
      - "**/*secret*"
      - "**/*deploy*"
      - "**/*gradle*"
      - "**/*key*"
      - "**/*token*"
    load:
      - .cursor/rules/security.mdc
  deployment:
    globs:
      - DEPLOYMENT.md
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "**/*deploy*"
      - "**/*infra*"
      - "**/*terraform*"
      - "**/*.tf"
      - "wrangler.*"
    load:
      - .cursor/rules/deployment.mdc
      - .cursor/rules/security.mdc
  testing:
    globs:
      - TOOLING_GUIDE.md
      - "**/*test*"
      - "**/*spec*"
      - "package.json"
      - "pyproject.toml"
      - "go.mod"
      - "Cargo.toml"
      - ".github/workflows/**"
    load:
      - .cursor/rules/testing.mdc
  rule_authoring:
    globs:
      - AGENTS.md
      - AI_DIRECTIVES.md
      - TOOLING_GUIDE.md
      - .rulesrc.yaml
      - ".cursor/rules/**"
    load:
      - .cursor/rules/rules.mdc

checkpoints:
  max_hand_edited_code_files_per_pass: 3
  allow_docs_only_batch: true
  allow_mechanical_generated_batch: true
  require_status_before_edits: true
  require_verification_before_next_pass: true
  require_handoff_for_long_running_work: true
  auto_commit: false
  require_human_approval_for:
    - production_deploy
    - secret_rotation
    - database_migration
    - public_api_breaking_change
    - destructive_git
    - more_than_3_hand_edited_code_files

risk_tiers:
  P0:
    stop_for_approval: true
    examples:
      - secrets
      - destructive_git
      - production_deploy
      - credential_rotation
      - public_api_breaking_change
      - database_migration
  P1:
    checkpoint_required: true
    examples:
      - api_addition
      - auth_change
      - ci_change
      - dependency_change
      - multi_file_code_change
      - user_facing_behavior_change
  P2:
    proceed_with_light_verification: true
    examples:
      - docs_polish
      - small_refactor
      - style
      - naming
